<title>¿Quién Sabe Más? · Sala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#160d3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap">
<style>
/* Concepto: el celular es el "pulsador" del concurso de la tele. Escenario morado, oro de marca y los 4 colores A-D
   del programa a pantalla completa; todo lo demás queda en segundo plano. Diseño de un solo look (escenario oscuro). */
:root {
  --escenario: #160d3a;
  --escenario-2: #3b1873;
  --panel: #241452;
  --panel-borde: #3f2c80;
  --tinta: #ffffff;
  --tenue: #b3a8dc;
  --oro: #ffc828;
  --oro-tinta: #1a1240;
  --a: #e74c3c; --b: #2f80ed; --c: #f0aa14; --d: #27ae60;
  --bien: #2ecc71; --mal: #ff5a4f;
  --f-display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --f-cuerpo: "Poppins", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--escenario); color: var(--tinta);
  font-family: var(--f-cuerpo); font-size: 16px; line-height: 1.4;
  background-image: radial-gradient(120% 70% at 50% 0%, var(--escenario-2) 0%, var(--escenario) 70%);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
.app {
  min-height: 100%; max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.marca { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--f-display); font-weight: 800; color: var(--oro); font-size: 1.15rem; letter-spacing: -0.01em; }
.chip { font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tenue);
  border: 1px solid var(--panel-borde); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.chip b { color: var(--tinta); }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.9rem, 8vw, 2.4rem); line-height: 1.05; margin: 4px 0 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; margin: 0; text-wrap: balance; }
.sub { color: var(--tenue); margin: 0; }
.bloque { background: var(--panel); border: 1px solid var(--panel-borde); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
label { font-weight: 600; font-size: .9rem; }
input[type=text] {
  width: 100%; font: 600 1.15rem var(--f-cuerpo); color: var(--oro-tinta); background: #fff;
  border: 3px solid transparent; border-radius: 14px; padding: 12px 14px; outline: none;
}
input[type=text]:focus { border-color: var(--oro); }
input.codigo { text-transform: uppercase; letter-spacing: .3em; text-align: center; font-size: 1.5rem; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; font-size: .88rem; color: var(--tenue); }
.check input { width: 20px; height: 20px; accent-color: var(--oro); margin-top: 1px; flex: none; }
button { font-family: var(--f-display); cursor: pointer; border: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--oro); outline-offset: 3px; }
.btn { width: 100%; font-weight: 700; font-size: 1.1rem; border-radius: 16px; padding: 15px 18px; color: var(--oro-tinta); background: var(--oro);
  box-shadow: 0 5px 0 #b8860b; transition: transform .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8860b; }
.btn.sec { background: transparent; color: var(--tinta); border: 2px solid var(--panel-borde); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: default; }
.fila { display: flex; gap: 10px; }
.fila > * { flex: 1; min-width: 0; }
.error { color: var(--mal); font-weight: 600; font-size: .9rem; margin: 0; }
.nota { font-size: .82rem; color: var(--tenue); margin: 0; }

/* sala de espera */
.codigo-grande { font-family: var(--f-display); font-weight: 800; font-size: 3.2rem; letter-spacing: .18em; color: var(--oro); text-align: center; line-height: 1; padding-left: .18em; }
.jugadores { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
.jugadores li { background: var(--escenario); border: 1px solid var(--panel-borde); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: .9rem; }
.jugadores li.yo { border-color: var(--oro); color: var(--oro); }
.empezar { font-size: 1.6rem; padding: 22px; border-radius: 22px; }

/* juego */
.estado { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.num { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; }
.num span { color: var(--tenue); font-weight: 600; }
.marcador { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--oro); }
.reloj { height: 14px; border-radius: 999px; background: var(--panel); overflow: hidden; }
.reloj i { display: block; height: 100%; width: 100%; background: var(--oro); border-radius: 999px; transform-origin: left; transition: background .3s; }
.reloj.urge i { background: var(--mal); }
.pregunta { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; line-height: 1.25; text-wrap: balance; margin: 0; min-height: 2.5em; }
.opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; min-height: 300px; }
.op { position: relative; border-radius: 20px; color: #fff; text-align: left; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  font-weight: 700; font-size: 1.05rem; line-height: 1.2; box-shadow: 0 6px 0 rgba(0,0,0,.28); transition: transform .08s, opacity .25s, filter .25s; min-width: 0; overflow-wrap: anywhere; }
.op:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.28); }
.op .letra { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 1.35rem; font-weight: 800; }
.op[data-i="0"] { background: var(--a); } .op[data-i="0"] .letra { color: var(--a); }
.op[data-i="1"] { background: var(--b); } .op[data-i="1"] .letra { color: var(--b); }
.op[data-i="2"] { background: var(--c); } .op[data-i="2"] .letra { color: var(--c); }
.op[data-i="3"] { background: var(--d); } .op[data-i="3"] .letra { color: var(--d); }
.opciones.bloqueado .op { opacity: .35; filter: saturate(.4); cursor: default; }
.opciones.bloqueado .op.elegida { opacity: 1; filter: none; outline: 4px solid #fff; outline-offset: 3px; }
.opciones.cerrado .op.correcta { opacity: 1; filter: none; outline: 4px solid #fff; outline-offset: 3px; }
.opciones.cerrado .op.correcta::after { content: "✓"; position: absolute; top: 10px; right: 14px; font-size: 1.6rem; }
.aviso { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 12px; }
.aviso .grande { font-family: var(--f-display); font-weight: 800; font-size: 2.2rem; line-height: 1.05; }
.aviso .grande.bien { color: var(--bien); } .aviso .grande.mal { color: var(--mal); }
.puntos-ganados { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; color: var(--oro); font-variant-numeric: tabular-nums; }
.tele-icono { width: 72px; height: 54px; border: 4px solid var(--oro); border-radius: 12px; position: relative; }
.tele-icono::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 26px; height: 6px; margin-left: -13px; background: var(--oro); border-radius: 3px; }
@media (prefers-reduced-motion: no-preference) { .tele-icono { animation: latido 1.6s ease-in-out infinite; } }
@keyframes latido { 50% { transform: scale(1.06); } }

.ranking { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: pos; }
.ranking li { counter-increment: pos; display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--escenario); font-weight: 600; }
.ranking li::before { content: counter(pos); font-family: var(--f-display); font-weight: 800; color: var(--tenue); text-align: center; }
.ranking li:first-child::before { color: var(--oro); }
.ranking li.yo { outline: 2px solid var(--oro); }
.ranking .pts { font-variant-numeric: tabular-nums; color: var(--oro); }
.ranking .nom { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.herramientas { display: flex; gap: 8px; flex-wrap: wrap; }
.mini { font-weight: 600; font-size: .85rem; color: var(--tenue); background: transparent; border: 1px solid var(--panel-borde); border-radius: 999px; padding: 7px 12px; }
.mini:active { background: var(--panel); }
.panel-ajuste { display: flex; flex-direction: column; gap: 10px; }
.panel-ajuste select { font: 600 1rem var(--f-cuerpo); padding: 10px; border-radius: 12px; background: #fff; color: var(--oro-tinta); border: 0; }

.rango { font-family: var(--f-display); font-weight: 800; font-size: 2rem; color: var(--oro); line-height: 1.05; text-wrap: balance; }
.cifras { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cifra { background: var(--escenario); border-radius: 14px; padding: 12px; text-align: center; }
.cifra b { display: block; font-family: var(--f-display); font-size: 1.8rem; font-variant-numeric: tabular-nums; }
.cifra small { color: var(--tenue); font-weight: 600; }

/* barra de demostración (solo en la vista previa) */
.demo { border: 2px dashed var(--oro); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: .85rem; }
.demo .tit { font-weight: 700; color: var(--oro); text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; }
.demo .pantalla { font-weight: 600; }
.demo .fila .mini { flex: 1; }
</style>

<div class="app" id="app" aria-live="polite"></div>

<script>
/* ¿Quién Sabe Más? — app del jugador.
   En quiensabemastv.pages.dev usa /episodios/<SALA>.json y la API /api/*. En cualquier otro sitio corre en
   MODO DEMO: episodio de la maqueta incrustado, tele simulada y 3 jugadores de ejemplo. */
const EP_DEMO = /*EP_DEMO*/null;
const PROD = /quiensabemastv\.pages\.dev$/.test(location.hostname);
const DEMO = !PROD;
const SALA = ((new URLSearchParams(location.search).get('sala')) || (EP_DEMO && EP_DEMO.sala) || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const CANAL = 'https://www.youtube.com/@QuienSabeMasTV';
const RANGOS = [[0.34, 'Aprendiz curioso'], [0.67, 'Sabelotodo en camino'], [0.91, 'Experto'], [1.01, '¡GENIO TOTAL!']];

const $app = document.getElementById('app');
const S = { ep: null, apodo: '', fama: false, modo: null, codigo: '', jugador: '', g: null, off: 0,
            puntos: 0, aciertos: 0, resp: {}, enviados: {}, ranking: [], jugadores: [], vista: 'inicio', fase: '', error: '' };

const guardar = (k, v) => { try { localStorage.setItem('qsm_' + k, JSON.stringify(v)); } catch (e) {} };
const leer = (k, d) => { try { const v = localStorage.getItem('qsm_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fnv(str) { let h = 0x811c9dc5; for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
const esCorrecta = (q, i) => fnv(`${S.ep.sala}|${q.n}|${i}`) === q.h;

/* ------------------------------------------------------------------ API (real o simulada) */
const API = {
  async llamar(ruta, cuerpo) {
    if (DEMO) return Demo.api(ruta, cuerpo);
    const r = await fetch('/api/' + ruta, cuerpo ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(cuerpo) } : {});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'No hay conexión con la sala');
    return r.json();
  },
};
function aplicarEstado(e) {
  if (!e) return;
  if (e.ahora) S.off = e.ahora - Date.now();
  if (e.grupo) S.g = e.grupo;
  if (e.ranking) S.ranking = e.ranking;
  if (e.jugadores) S.jugadores = e.jugadores;
}

/* ------------------------------------------------------------------ reloj del programa */
function tPrograma() {
  const g = S.g; if (!g || !g.inicio) return null;
  const ahora = Date.now() + S.off;
  return (ahora - g.inicio - (g.pausado || 0) - (g.pausa ? ahora - g.pausa : 0) + (g.ajuste || 0)) / 1000;
}
function fase(t) {
  const T = S.ep.tiempos;
  if (t === null) return { tipo: 'espera' };
  if (t < T[0].abre) return { tipo: 'previa', q: T[0] };
  for (let k = T.length - 1; k >= 0; k--) {
    const x = T[k];
    if (t >= x.abre) {
      if (t <= x.cierra + 1) return { tipo: 'abierta', q: x, k };
      if (k === T.length - 1 && t > x.cierra + 9) return { tipo: 'final' };
      return { tipo: 'resultado', q: x, k };
    }
  }
}
const pregunta = n => S.ep.preguntas.find(p => p.n === n);

/* ------------------------------------------------------------------ acciones */
async function crearGrupo() {
  if (!validarApodo()) return;
  try {
    const r = await API.llamar('grupo', { sala: S.ep.sala });
    S.codigo = r.codigo; await unir();
  } catch (e) { S.error = e.message; pintar(); }
}
async function unirseA(codigo) {
  if (!validarApodo()) return;
  S.codigo = codigo.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (S.codigo.length < 4) { S.error = 'El código del grupo tiene 4 letras.'; return pintar(); }
  try { await unir(); } catch (e) { S.error = e.message; pintar(); }
}
async function unir() {
  const r = await API.llamar('unir', { codigo: S.codigo, apodo: S.apodo, fama: S.fama, sala: S.ep.sala });
  S.jugador = r.jugador; S.modo = 'grupo'; aplicarEstado(r);
  guardar('sesion', { sala: S.ep.sala, codigo: S.codigo, jugador: S.jugador, apodo: S.apodo });
  S.error = ''; S.vista = 'juego'; pintar();
}
function jugarSolo() {
  if (!validarApodo()) return;
  S.modo = 'solo'; S.g = { inicio: null, pausa: null, pausado: 0, ajuste: 0 }; S.vista = 'juego'; pintar();
}
function validarApodo() {
  const a = (document.getElementById('apodo')?.value || S.apodo).trim().replace(/\s+/g, ' ').slice(0, 14);
  S.fama = !!document.getElementById('fama')?.checked;
  if (a.length < 2) { S.error = 'Escribe un apodo de al menos 2 letras.'; pintar(); return false; }
  S.apodo = a; guardar('apodo', a); S.error = ''; return true;
}
async function control(accion, valor) {
  const ahora = Date.now() + S.off;
  if (S.modo === 'solo') {
    const g = S.g;
    if (accion === 'empezar' && !g.inicio) g.inicio = ahora;
    if (accion === 'pausa' && !g.pausa) g.pausa = ahora;
    if (accion === 'seguir' && g.pausa) { g.pausado += ahora - g.pausa; g.pausa = null; }
    if (accion === 'ajuste') g.ajuste = (g.ajuste || 0) + valor;
    return pintar();
  }
  try { aplicarEstado(await API.llamar('control', { codigo: S.codigo, accion, valor })); } catch (e) { S.error = e.message; }
  pintar();
}
function irAPregunta(n) {
  const x = S.ep.tiempos.find(t => t.n === n); const t = tPrograma(); if (!x || t === null) return;
  control('ajuste', Math.round((x.abre + 0.5 - t) * 1000));
}
function responder(i) {
  const f = fase(tPrograma()); if (f.tipo !== 'abierta' || S.resp[f.q.n]) return;
  const q = pregunta(f.q.n), t = tPrograma();
  const ok = esCorrecta(q, i);
  const resto = Math.max(0, Math.min(1, (f.q.cierra - t) / Math.max(1, f.q.cierra - f.q.abre)));
  const pts = ok ? 500 + Math.round(500 * resto) : 0;
  S.resp[q.n] = { i, ok, pts };
  if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
  pintar();
}
function cerrarPregunta(x) {
  const r = S.resp[x.n];
  if (r && !r.contado) { r.contado = true; S.puntos += r.pts; if (r.ok) S.aciertos++; }
  if (S.modo === 'grupo' && !S.enviados[x.n]) {
    S.enviados[x.n] = true;
    API.llamar('marcador', { codigo: S.codigo, jugador: S.jugador, puntos: S.puntos, aciertos: S.aciertos, n: x.n })
      .then(e => { aplicarEstado(e); pintar(); }).catch(() => {});
  }
}

/* ------------------------------------------------------------------ vistas */
function pintar() {
  const v = S.vista;
  if (v === 'cargando') $app.innerHTML = cabecera() + `<p class="sub">Abriendo la sala…</p>`;
  else if (v === 'sin-sala') $app.innerHTML = cabecera() + `<div class="bloque"><h2>Esta sala no existe</h2><p class="sub">Revisa el código que aparece en la esquina del video y vuelve a escanear el QR.</p></div>`;
  else if (v === 'inicio') vistaInicio();
  else if (v === 'unirse') vistaUnirse();
  else vistaJuego();
}
function cabecera() {
  return `<div class="marca"><span class="logo">¿Quién Sabe Más?</span>${S.ep ? `<span class="chip">Sala <b>${esc(S.ep.sala)}</b></span>` : ''}</div>` + (DEMO ? barraDemo() : '');
}
function vistaInicio() {
  $app.innerHTML = cabecera() + `
    <div><p class="sub">Hoy jugamos</p><h1>${esc(S.ep.titulo)}</h1></div>
    <div class="bloque">
      <label for="apodo">Tu apodo</label>
      <input type="text" id="apodo" maxlength="14" autocomplete="nickname" placeholder="Ej.: Tía Carmen" value="${esc(S.apodo)}">
      <label class="check"><input type="checkbox" id="fama" ${S.fama ? 'checked' : ''}> Quiero que mi apodo pueda salir en el Salón de la fama del próximo episodio</label>
      ${S.error ? `<p class="error">${esc(S.error)}</p>` : ''}
    </div>
    <button class="btn" id="b-crear">Crear grupo</button>
    <div class="fila"><button class="btn sec" id="b-unirse">Tengo un código</button><button class="btn sec" id="b-solo">Jugar solo</button></div>
    <p class="nota">Juegan todos frente a la misma tele. Uno crea el grupo y los demás entran con su código.</p>`;
  on('b-crear', crearGrupo); on('b-solo', jugarSolo);
  on('b-unirse', () => { if (validarApodo()) { S.vista = 'unirse'; pintar(); } });
}
function vistaUnirse() {
  $app.innerHTML = cabecera() + `
    <h2>Entra al grupo</h2>
    <div class="bloque">
      <label for="cod">Código del grupo</label>
      <input type="text" id="cod" class="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
      ${S.error ? `<p class="error">${esc(S.error)}</p>` : ''}
      <p class="nota">Pídeselo a quien creó el grupo: aparece grande en su celular.</p>
    </div>
    <button class="btn" id="b-entrar">Entrar</button>
    <button class="btn sec" id="b-volver">Volver</button>`;
  const inp = document.getElementById('cod'); inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') unirseA(inp.value); });
  on('b-entrar', () => unirseA(inp.value)); on('b-volver', () => { S.error = ''; S.vista = 'inicio'; pintar(); });
}
function vistaJuego() {
  const t = tPrograma(), f = fase(t); S.fase = f.tipo + (f.q ? f.q.n : '');
  let cuerpo = '';
  if (f.tipo === 'espera') {
    cuerpo = `
      ${S.modo === 'grupo' ? `<div class="bloque"><p class="sub" style="text-align:center">Código del grupo</p><div class="codigo-grande">${esc(S.codigo)}</div>
        <p class="nota" style="text-align:center">Los demás tocan «Tengo un código» y lo escriben.</p>
        <ul class="jugadores">${S.jugadores.map(j => `<li class="${j === S.apodo ? 'yo' : ''}">${esc(j)}</li>`).join('')}</ul></div>` : ''}
      <div class="aviso"><div class="tele-icono" aria-hidden="true"></div><h2>Mira la tele</h2>
        <p class="sub">Cuando el presentador diga <b>«¡YA!»</b>, toca EMPEZAR. ${S.modo === 'grupo' ? 'Basta con que lo toque una persona del grupo.' : ''}</p></div>
      <button class="btn empezar" id="b-empezar">EMPEZAR</button>`;
  } else if (f.tipo === 'previa') {
    cuerpo = `<div class="aviso"><div class="tele-icono" aria-hidden="true"></div><h2>¡Atentos!</h2><p class="sub">La primera pregunta aparece en la tele en unos segundos.</p></div>`;
  } else if (f.tipo === 'abierta') {
    const q = pregunta(f.q.n), r = S.resp[q.n];
    const enReloj = t >= f.q.reloj, frac = enReloj ? Math.max(0, (f.q.cierra - t) / (f.q.cierra - f.q.reloj)) : 1;
    cuerpo = `
      <div class="estado"><span class="num">Pregunta ${q.n} <span>de ${S.ep.total}</span></span><span class="marcador">${S.puntos.toLocaleString('es')} pts</span></div>
      <div class="reloj ${enReloj && frac < 0.3 ? 'urge' : ''}"><i id="barra" style="transform:scaleX(${frac.toFixed(3)})"></i></div>
      <p class="pregunta">${esc(q.p)}</p>
      <div class="opciones ${r ? 'bloqueado' : ''}">${q.o.map((o, i) => `<button class="op ${r && r.i === i ? 'elegida' : ''}" data-i="${i}" ${r ? 'disabled' : ''}><span class="letra">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>
      <p class="nota" style="text-align:center">${r ? 'Respuesta enviada. Espera a que la revelen en la tele.' : enReloj ? '¡Rápido! Mientras antes respondas, más puntos.' : 'Escucha la pregunta y elige.'}</p>`;
  } else if (f.tipo === 'resultado') {
    const q = pregunta(f.q.n), r = S.resp[q.n]; cerrarPregunta(f.q);
    const sig = S.ep.tiempos[f.k + 1];
    cuerpo = `
      <div class="estado"><span class="num">Pregunta ${q.n} <span>de ${S.ep.total}</span></span><span class="marcador">${S.puntos.toLocaleString('es')} pts</span></div>
      <div class="aviso">${r ? (r.ok ? `<div class="grande bien">¡Correcto!</div><div class="puntos-ganados">+${r.pts} puntos</div>` : `<div class="grande mal">¡Uy, no!</div>`) : `<div class="grande">Sin respuesta</div>`}
        <p class="sub">Era la <b>${'ABCD'[q.o.findIndex((_, i) => esCorrecta(q, i))]}</b>: ${esc(q.o.find((_, i) => esCorrecta(q, i)) || '')}</p></div>
      ${S.modo === 'grupo' ? tablaGrupo() : ''}
      <p class="nota" style="text-align:center">${sig ? `Sigue la pregunta ${sig.n}. Mira la tele.` : 'Última pregunta. ¡Ahora vienen los resultados!'}</p>`;
  } else if (f.tipo === 'final') {
    S.ep.tiempos.forEach(cerrarPregunta);
    const tot = S.ep.preguntas.length, frac = S.aciertos / Math.max(1, tot);
    const rango = RANGOS.find(([lim]) => frac < lim)[1];
    cuerpo = `
      <div><p class="sub">¿Qué tan genio eres?</p><div class="rango">${rango}</div></div>
      <div class="cifras"><div class="cifra"><b>${S.aciertos}/${tot}</b><small>aciertos</small></div><div class="cifra"><b>${S.puntos.toLocaleString('es')}</b><small>puntos</small></div></div>
      ${S.modo === 'grupo' ? tablaGrupo('Así quedó el grupo') : ''}
      <a class="btn" href="${CANAL}?sub_confirmation=1" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;display:block">Suscríbete para la próxima partida</a>
      <p class="nota" style="text-align:center">Cuenta tu puntaje en los comentarios del video.</p>`;
  }
  const pausado = S.g && S.g.pausa;
  const herramientas = (f.tipo !== 'espera' && f.tipo !== 'final') ? `
    <div class="herramientas">
      <button class="mini" id="b-pausa">${pausado ? '▶ Seguir' : '❚❚ Pausé el video'}</button>
      <button class="mini" id="b-sinc">¿Desfasado? Sincronizar</button>
    </div>
    <div class="bloque panel-ajuste" id="ajuste" hidden>
      <label for="sel-q">¿Qué pregunta ves ahora en la tele?</label>
      <select id="sel-q">${S.ep.tiempos.map(x => `<option value="${x.n}" ${f.q && f.q.n === x.n ? 'selected' : ''}>Pregunta ${x.n}</option>`).join('')}</select>
      <button class="btn" id="b-ir">Ponerme en esa pregunta</button>
      <div class="fila"><button class="mini" id="b-menos">Voy adelantado (−2 s)</button><button class="mini" id="b-mas">Voy atrasado (+2 s)</button></div>
    </div>` : '';
  $app.innerHTML = cabecera() + (pausado && f.tipo !== 'espera' ? `<div class="bloque"><h2>En pausa</h2><p class="sub">Cuando sigan viendo el video, toca «Seguir».</p></div>` : '') + cuerpo + herramientas + (S.error ? `<p class="error">${esc(S.error)}</p>` : '');
  on('b-empezar', () => control('empezar'));
  document.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => responder(+b.dataset.i)));
  on('b-pausa', () => control(pausado ? 'seguir' : 'pausa'));
  on('b-sinc', () => { const a = document.getElementById('ajuste'); a.hidden = !a.hidden; });
  on('b-ir', () => irAPregunta(+document.getElementById('sel-q').value));
  on('b-menos', () => control('ajuste', -2000)); on('b-mas', () => control('ajuste', 2000));
  if (f.tipo === 'resultado' || f.tipo === 'final') document.querySelectorAll('.opciones').forEach(o => o.classList.add('cerrado'));
}
function tablaGrupo(titulo = 'Tu grupo') {
  const filas = (S.ranking || []).slice(0, 8);
  if (!filas.length) return '';
  return `<div class="bloque"><h2>${titulo}</h2><ol class="ranking">${filas.map(j => `<li class="${j.apodo === S.apodo ? 'yo' : ''}"><span class="nom">${esc(j.apodo)}</span><span class="pts">${(j.puntos || 0).toLocaleString('es')}</span></li>`).join('')}</ol></div>`;
}
function on(id, fn) { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); }

/* refresco: el reloj se mueve sin repintar todo; se repinta solo al cambiar de fase */
setInterval(() => {
  if (S.vista !== 'juego') return;
  const t = tPrograma(), f = fase(t), clave = f.tipo + (f.q ? f.q.n : '') + (S.g && S.g.pausa ? 'p' : '');
  if (clave !== S.fase + (S.g && S.g.pausa ? 'p' : '')) return pintar();
  const barra = document.getElementById('barra');
  if (barra && f.tipo === 'abierta' && t >= f.q.reloj) {
    const frac = Math.max(0, (f.q.cierra - t) / (f.q.cierra - f.q.reloj));
    barra.style.transform = `scaleX(${frac.toFixed(3)})`; barra.parentElement.classList.toggle('urge', frac < 0.3);
  }
}, 150);
/* sincronía del grupo: cada 15 s (pausas, quién entró, ranking) */
setInterval(async () => {
  if (S.vista !== 'juego' || S.modo !== 'grupo') return;
  try { const antes = JSON.stringify([S.g, S.jugadores]); aplicarEstado(await API.llamar('estado?codigo=' + S.codigo)); if (JSON.stringify([S.g, S.jugadores]) !== antes) pintar(); } catch (e) {}
}, DEMO ? 3000 : 15000);

/* ------------------------------------------------------------------ modo demo (vista previa) */
const Demo = {
  grupo: null, bots: [],
  async api(ruta, c) {
    await new Promise(r => setTimeout(r, 150));
    const ahora = Date.now();
    if (ruta === 'grupo') { this.grupo = { codigo: 'KQ7M', inicio: null, pausa: null, pausado: 0, ajuste: 0 }; return { codigo: 'KQ7M' }; }
    if (ruta === 'unir') {
      if (!this.grupo || c.codigo !== this.grupo.codigo) { this.grupo = { codigo: c.codigo, inicio: null, pausa: null, pausado: 0, ajuste: 0 }; }
      this.bots = [{ apodo: 'Abuela Rosa', p: .8, puntos: 0 }, { apodo: 'Tío Beto', p: .55, puntos: 0 }, { apodo: 'Mateo', p: .7, puntos: 0 }];
      return { jugador: 'yo', ...this.estado(c.apodo) };
    }
    if (ruta === 'control') {
      const g = this.grupo;
      if (c.accion === 'empezar' && !g.inicio) g.inicio = ahora;
      if (c.accion === 'pausa' && !g.pausa) g.pausa = ahora;
      if (c.accion === 'seguir' && g.pausa) { g.pausado += ahora - g.pausa; g.pausa = null; }
      if (c.accion === 'ajuste') g.ajuste += c.valor;
      return this.estado();
    }
    if (ruta === 'marcador') { this.bots.forEach(b => { if (Math.random() < b.p) b.puntos += 500 + Math.round(Math.random() * 450); }); this.yo = c.puntos; return this.estado(); }
    return this.estado();
  },
  estado(apodo) {
    const yo = { apodo: apodo || S.apodo, puntos: this.yo || 0 };
    const todos = [yo, ...this.bots].sort((a, b) => b.puntos - a.puntos);
    return { ahora: Date.now(), grupo: { ...this.grupo }, jugadores: [yo.apodo, ...this.bots.map(b => b.apodo)], ranking: todos };
  },
};
function barraDemo() {
  const t = S.vista === 'juego' ? tPrograma() : null; let tele = 'Lobby con el código QR';
  if (t !== null && S.ep) {
    const f = fase(t);
    if (f.tipo === 'previa') tele = '«¡YA!» → tarjeta de la pregunta ' + f.q.n;
    else if (f.tipo === 'abierta') tele = t < f.q.reloj ? `Leyendo la pregunta ${f.q.n}` : `Reloj de la pregunta ${f.q.n}: ${Math.max(0, Math.ceil(f.q.cierra - t))} s`;
    else if (f.tipo === 'resultado') tele = `Revelando la pregunta ${f.q.n} y su dato curioso`;
    else if (f.tipo === 'final') tele = 'Rangos y despedida';
  }
  return `<div class="demo"><span class="tit">Vista previa · tele simulada</span><span class="pantalla">En la tele: ${tele}</span>
    ${S.vista === 'juego' && t !== null ? `<div class="fila"><button class="mini" id="d-salto">Adelantar 10 s</button><button class="mini" id="d-sig">Siguiente pregunta</button></div>` : ''}</div>`;
}
document.addEventListener('click', e => {
  if (!DEMO || !S.g) return;
  if (e.target.id === 'd-salto') { S.g.ajuste = (S.g.ajuste || 0) + 10000; if (Demo.grupo) Demo.grupo.ajuste = S.g.ajuste; pintar(); }
  if (e.target.id === 'd-sig') {
    const t = tPrograma(), sig = S.ep.tiempos.find(x => x.abre > t + 0.5);
    const salto = sig ? (sig.abre + 0.3 - t) * 1000 : 20000;
    S.g.ajuste = (S.g.ajuste || 0) + salto; if (Demo.grupo) Demo.grupo.ajuste = S.g.ajuste; pintar();
  }
});
if (DEMO) setInterval(() => { const el = document.querySelector('.demo .pantalla'); if (el && S.vista === 'juego') { const tmp = document.createElement('div'); tmp.innerHTML = barraDemo(); el.textContent = tmp.querySelector('.pantalla').textContent; } }, 500);

/* ------------------------------------------------------------------ arranque */
(async function arrancar() {
  S.apodo = leer('apodo', ''); S.vista = 'cargando'; pintar();
  try {
    if (DEMO) S.ep = EP_DEMO;
    else {
      const r = await fetch('/episodios/' + SALA + '.json'); if (!r.ok) throw 0; S.ep = await r.json();
    }
  } catch (e) { S.vista = 'sin-sala'; return pintar(); }
  if (!S.ep) { S.vista = 'sin-sala'; return pintar(); }
  // volver a la partida si se recargó la página
  const ses = leer('sesion', null);
  if (!DEMO && ses && ses.sala === S.ep.sala && ses.codigo) {
    try { S.codigo = ses.codigo; S.jugador = ses.jugador; S.apodo = ses.apodo; S.modo = 'grupo';
          aplicarEstado(await API.llamar('estado?codigo=' + S.codigo)); S.vista = 'juego'; return pintar(); } catch (e) {}
  }
  S.vista = 'inicio'; pintar();
})();
</script>
