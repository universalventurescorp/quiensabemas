name: imagenes
# Descarga candidatas de imágenes libres para una lista de consultas y las guarda en el repo.
on:
  workflow_dispatch:
  push:
    paths: ["contenido/consultas_*.json", ".github/workflows/imagenes.yml", "scripts/buscar_imagenes.py"]

permissions:
  contents: write

concurrency:
  group: imagenes
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Banderas (dominio público, flag-icons)
        run: |
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets/banderas
          for c in pe jp br ca kr mx co ar cl es it fr de gb us cn in eg au ru; do
            [ -f assets/banderas/$c.png ] && continue
            curl -sSfL "https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/flags/4x3/$c.svg" -o /tmp/$c.svg && \
            rsvg-convert -w 1200 /tmp/$c.svg -o assets/banderas/$c.png || echo "falla $c"
          done
      - name: Fotos de Wikimedia Commons
        run: |
          for f in contenido/consultas_*.json; do
            n=$(basename "$f" .json | sed 's/consultas_//')
            [ -f "assets/$n/creditos.json" ] && continue
            python3 scripts/buscar_imagenes.py "$f" "assets/$n" --n 4
          done
      - name: Guardar
        run: |
          git config user.name "quiensabemas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets
          git commit -m "Imágenes candidatas" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
