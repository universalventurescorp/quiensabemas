name: preguntas
# Claude escribe y verifica las preguntas de los próximos episodios (máx. 130 por noche) y las deja en contenido/cola/.
# Corre de noche y en un horario distinto al de quiet-cosmos, para no gastar el plan al mismo tiempo.
on:
  schedule:
    - cron: "37 1 * * *"       # 20:37 hora de Lima
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preguntas
  cancel-in-progress: false

jobs:
  escribir:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Claude escribe la cola
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Lee y sigue al pie de la letra las instrucciones de prompts/escritor.md. Usa el comando date para saber la fecha de hoy.
          claude_args: >-
            --model sonnet
            --max-turns 300
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python scripts/banco.py:*),Bash(python3 scripts/banco.py:*),Bash(date:*),Bash(ls:*)"
      - name: Revisión final y guardado
        run: |
          ok=1
          for f in contenido/cola/*.json; do
            [ -f "$f" ] || continue
            python scripts/banco.py revisar "$f" || {
              # un episodio con repetidas no puede quedar "listo"
              python - "$f" <<'EOF'
          import json, sys
          p = sys.argv[1]; e = json.load(open(p, encoding='utf-8'))
          if e.get('estado') == 'listo': e['estado'] = 'en_proceso'
          json.dump(e, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          EOF
              ok=0; }
          done
          git config user.name "quiensabemas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add contenido/cola contenido/calendario.json
          git commit -m "Preguntas: avance de la cola" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
