name: produccion
# Produce el próximo episodio listo de contenido/cola/ y lo sube a YouTube EN PRIVADO.
# preparar (fotos, revisión de repetidas) → voces en 6 máquinas a la vez → render → control de calidad → subida privada.
on:
  schedule:
    - cron: "7 6 * * *"        # todos los días 01:07 hora de Lima (de noche, para no chocar con los otros canales)
  workflow_dispatch:
    inputs:
      id:
        description: "Episodio a producir (vacío = el siguiente listo de la cola)"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: produccion
  cancel-in-progress: false

env:
  PARTES: 8

jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      id: ${{ steps.p.outputs.id }}
      formato: ${{ steps.p.outputs.formato }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - id: p
        run: python scripts/preparar_episodio.py --id "${{ inputs.id }}" --salida trabajo
      - if: steps.p.outputs.id != ''
        uses: actions/upload-artifact@v4
        with: { name: trabajo, path: trabajo, retention-days: 3 }

  voces:
    needs: preparar
    if: needs.preparar.outputs.id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6           # deja máquinas libres para los otros canales de la cuenta
      matrix:
        parte: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: trabajo, path: trabajo }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen3-tts-1.7b-base
      - name: Instalar (torch CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sox libsox-dev
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts soundfile transformers
      - name: Generar mi parte de las voces
        run: python scripts/generar_voces.py trabajo/episodio.json voces_ep --parte ${{ matrix.parte }} --partes $PARTES
      - uses: actions/upload-artifact@v4
        with: { name: "voces-${{ matrix.parte }}", path: voces_ep, retention-days: 3 }

  render:
    needs: [preparar, voces]
    if: needs.preparar.outputs.id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: trabajo, path: trabajo }
      - uses: actions/download-artifact@v4
        with: { pattern: "voces-*", path: voces_ep, merge-multiple: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy pillow scipy reportlab google-api-python-client google-auth
      - name: Descifrar la música (Biblioteca de audio de YouTube; sin la clave sale sin música)
        env: { MUSICA_CLAVE: "${{ secrets.MUSICA_CLAVE }}" }
        run: |
          if [ -n "$MUSICA_CLAVE" ]; then
            mkdir -p assets/musica
            printf '%s' "$MUSICA_CLAVE" > /tmp/clave
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:/tmp/clave -in assets/musica.enc | tar -x -C assets/musica && ls assets/musica || echo "::warning::No se pudo descifrar la música: el episodio sale sin música"
            rm -f /tmp/clave
          else
            echo "::warning::Falta el secret MUSICA_CLAVE: el episodio sale sin música"
          fi
      - name: Montar el video
        run: python pipeline/tv.py --contenido trabajo/episodio.json --voces voces_ep --out trabajo/video.mp4 --tmp tmp
      - name: Miniatura
        run: python pipeline/miniatura.py trabajo/episodio.json trabajo/miniatura.jpg
      - name: Control de calidad (si falla, no se sube)
        run: python scripts/control_calidad.py trabajo/episodio.json trabajo/video.mp4 trabajo/video.tiempos.json
      - name: Subir a YouTube EN PRIVADO
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_QSM: ${{ secrets.YT_REFRESH_TOKEN_QSM }}
        run: python scripts/subir_youtube.py trabajo/episodio.json trabajo/video.mp4 trabajo/video.tiempos.json trabajo/miniatura.jpg
      - name: Shorts «¿La sabes en 5 segundos?» (2 por episodio, 4 el maratón)
        continue-on-error: true
        run: python pipeline/shorts.py --contenido trabajo/episodio.json --voces voces_ep --salida trabajo/shorts
      - name: Subir los Shorts EN PRIVADO (con enlace al episodio)
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_QSM: ${{ secrets.YT_REFRESH_TOKEN_QSM }}
        run: python scripts/subir_shorts.py trabajo/episodio.json trabajo/shorts/shorts.json
      - name: Registrar (banco de preguntas, archivo de la web, publicados)
        run: |
          python scripts/exportar_episodio.py trabajo/episodio.json trabajo/video.tiempos.json
          python scripts/banco.py registrar trabajo/episodio.json
          ID="${{ needs.preparar.outputs.id }}"
          python - "$ID" <<'EOF'
          import json, sys, glob
          for p in glob.glob('contenido/cola/*.json'):
              e = json.load(open(p, encoding='utf-8'))
              if e.get('id') == sys.argv[1]:
                  e['estado'] = 'producido'; json.dump(e, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          EOF
          git config user.name "quiensabemas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add publicados web/episodios banco/preguntas.jsonl contenido/cola
          git commit -m "Producido $ID (subido en privado)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Publicar la sala del episodio en la web
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run web.yml --ref main -R "${{ github.repository }}"
      - name: Guardar el video por si hay que reintentar la subida
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: video, path: "trabajo/video*", retention-days: 2 }
