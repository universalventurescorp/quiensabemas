name: prueba-voz
# Mide si Qwen3-TTS corre a velocidad útil en las máquinas gratis de GitHub (CPU).
# Guarda los audios y el informe en pruebas/voz/ para escucharlos.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/prueba-voz.yml", "scripts/prueba_voz.py"]

permissions:
  contents: write

concurrency:
  group: prueba-voz
  cancel-in-progress: true

jobs:
  voz:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        modelo: ["Qwen/Qwen3-TTS-12Hz-0.6B-Base", "Qwen/Qwen3-TTS-12Hz-1.7B-Base"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar (torch CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sox libsox-dev ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts soundfile transformers
      - name: Generar
        run: |
          N=$(echo "${{ matrix.modelo }}" | sed 's#.*TTS-12Hz-##; s#-Base##')
          python scripts/prueba_voz.py --modelo "${{ matrix.modelo }}" --salida "pruebas/voz/$N"
      - name: Guardar en el repo
        if: always()
        run: |
          git config user.name "quiensabemas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pruebas banco/ref_textos.json 2>/dev/null || true
          git commit -m "Prueba de voz: ${{ matrix.modelo }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
